[project]
name = "lsewcx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lsewcx", email = "lse210085@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "daft>=0.7.26",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lsewcx = "lsewcx:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
